name: ABDİGM duyuru kontrolü

on:
  schedule:
    - cron: "0 6 * * *"   # her gün 06:00 UTC = 09:00 (Türkiye saati)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma

permissions:
  contents: write           # state/seen.json'u repoya geri yazmak için

concurrency:
  group: duyuru-kontrol
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Duyuruları kontrol et ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python duyuru_bot.py

      - name: State dosyasını kaydet
        if: always()
        run: |
          git config user.name  "duyuru-bot"
          git config user.email "duyuru-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F)" && git push)
